version: 0.0
os: linux

files:
  - source: .
    destination: /home/ec2-user/DFO-stats

hooks:
  # after CodeDeploy has copied your new bundle:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ec2-user

  # start (or restart) your app
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ec2-user