name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v3

      # 2. Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3. Build & test backend
      - name: Build & test backend
        working-directory: ./src
        run: |
          npm ci
      # leaving test out for now since migrating stack to TS
      #     npm test
      
      # # 4. Upload backend JUnit report
      # - name: Upload test report
      # if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-test-results
      #     path: test-results/junit.xml

      # 5. Build frontend
      - name: Build frontend
        working-directory: ./client
        run: |
          npm ci
          npm run build

      # 6. Make deploy hooks executable
      - name: Set execute bit on hooks
        run: |
          chmod +x scripts/*.sh

      # 7. Package everything (use pre-built client)
      - name: Zip artifact
        run: |
          # include pre-built client dist
          cp -r client/dist client/build-output
          zip -r deployment.zip . \
            -x "src/node_modules/**" \
               "client/node_modules/**" \
               "client/src/**" \
               "client/public/**" \
               ".git/**"

      # 8. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # 9. Upload to S3
      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${{ secrets.S3_BUCKET }}/deployment-${{ github.sha }}.zip

      # 10. Deploy with CodeDeploy
      - name: Deploy to CodeDeploy via AWS CLI
        run: |
          aws deploy create-deployment \
            --application-name       ${{ secrets.APPLICATION_NAME }} \
            --deployment-group-name  ${{ secrets.DEPLOYMENT_GROUP }} \
            --s3-location            bucket=${{ secrets.S3_BUCKET }},key=deployment-${{ github.sha }}.zip,bundleType=zip \
            --file-exists-behavior   OVERWRITE \
            --region                 ${{ secrets.AWS_REGION }}
