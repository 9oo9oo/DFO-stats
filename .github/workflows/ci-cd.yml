name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - uses: actions/checkout@v3

      # 2. Node.js setup
      - uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. Build & test backend
      - name: Build & test backend
        working-directory: ./src
        run: |
          npm ci
          # npm test    # uncomment if you have tests

      # 4. Build frontend
      - name: Build frontend
        working-directory: ./client
        run: |
          npm ci
          npm run build
      
      # Make your deploy scripts executable
      - name: Set execute bit on hooks
        run: chmod +x scripts/install_dependencies.sh scripts/start_server.sh

      # 5. Package everything
      - name: Zip artifact
        run: |
          zip -r deployment.zip . \
            -x "src/node_modules/**" \
               "client/node_modules/**" \
               ".git/**"

      # 6. Configure AWS creds (all AWS creds on github secrets)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # 7. Upload to S3
      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${{ secrets.S3_BUCKET }}/deployment-${{ github.sha }}.zip

      # 8. Deploy with CodeDeploy
      - name: Deploy to CodeDeploy via AWS CLI
        run: |
          aws deploy create-deployment \
            --application-name     ${{ secrets.APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.DEPLOYMENT_GROUP }} \
            --s3-location          bucket=${{ secrets.S3_BUCKET }},key=deployment-${{ github.sha }}.zip,bundleType=zip \
            --region               ${{ secrets.AWS_REGION }}
